<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我想永远陪着你-医疗</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand" id="brandTitle" title="双击改生理期"><span class="dot"></span><span>我想永远陪着你 · 医疗</span></div>
    </header>
<div id="linkbar" style="margin:8px 0 4px;padding:8px 10px;border-radius:10px;background:rgba(128,128,128,.10);font-size:12px;line-height:1.6">连接状态：检查中…</div>

    <div class="card">
      <div id="quoteCard">
      <div class="card-title"><span>身体</span></div>
      <div class="split">
        <div class="col">
          <dl class="kv">
            <dt>健康</dt><dd id="statePill">—</dd>
            <dt>症状</dt><dd id="status">—</dd>
            <dt>描述</dt><dd id="note">—</dd>
            <dt>是否就医</dt><dd id="treated">—</dd>
            <dt>医保已用</dt><dd id="used">—</dd>
          </dl>
          <div class="meta" id="timeHint"></div>
        </div>
        <div class="col">
          <div class="sub-title">治疗报价</div>
          <dl class="kv">
            <dt>总费用</dt><dd id="total">—</dd>
            <dt>医保报销</dt><dd id="reimbursed">—</dd>
            <dt>需自付</dt><dd id="selfpay">—</dd>
          </dl>
          <div class="meta" id="autoHint">—</div>
        </div>
      </div>
      </div>

      <div class="sep"></div>
      <div class="card-title"><span>今日药价</span><span class="hint" id="drugHint">—</span></div>
      <ul class="list" id="drugPrices"><li class="empty">加载中…</li></ul>

      <div class="sep"></div>
      <div class="card-title"><span>就医记录</span></div>
      <ul class="list" id="history"><li class="empty">还没有记录</li></ul>
    </div>

    <div class="foot">反馈群 1055679275</div>
  </div>

  <div class="modal" id="periodModal" hidden>
    <div class="modal-card">
      <div class="card-title"><span>生理期设置</span><span class="hint">双击「医疗」标题打开</span></div>
      <label class="field"><span>周期天数</span><input id="periodCycle" type="number" min="10" max="60" /></label>
      <label class="field"><span>上次开始</span><input id="periodStart" type="date" /></label>
      <div class="row between" style="margin-top:10px">
        <button id="periodSave" class="btn">保存</button>
        <button id="periodClose" class="btn">关闭</button>
      </div>
      <div class="meta" id="periodHint">数值生效后，生理期开始会给她 Energy−20 / Anger+15 / 身+20</div>
    </div>
  </div>
  <script src="./app.js?v=1.4.4"></script>
</body>
</html>
